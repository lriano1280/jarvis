name: nightly
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pandas
      - name: Descargar Parquet
        working-directory: m1
        run: |
          mkdir -p data
          curl -fL -o data/yellow_tripdata_2025-01.parquet \
            "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2025-01.parquet"
      - name: Correr consulta
        working-directory: m1
        run: python query.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: m1/resultado.csv