
name: Nightly Taxi Analysis

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install duckdb pandas pyarrow

      - name: Descargar Parquet
        run: |
          mkdir -p m1/data
          curl -L --fail \
            -o m1/data/yellow_tripdata_2025-01.parquet \
            https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2025-01.parquet

      - name: Ejecutar análisis
        working-directory: m1
        run: python query.py

      - name: Guardar CSV como artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultado-taxi
          path: m1/resultado.csv
